<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EduQuest Auth</title>
    <!-- Bootstrap CSS (for future use in admin/user pages) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="landing-page.css">
</head>
<body>

<div class="overlay"></div>

<div class="auth-container">

    <!-- ================= LOGIN PAGE ================= -->
    <div class="page active" id="loginPage">

        <div class="left-panel">
            <div class="logo-icon">🎓</div>
            <h1>EduQuest</h1>
            <p>Unlock Your Potential</p>
        </div>

        <div class="divider"></div>

        <div class="right-panel">
            <h2>Welcome Back</h2>

            <form id="loginForm">

                <label>USERNAME</label>
                <input type="text" id="loginUsername">
                <small class="error" id="loginUsernameError"></small>

                <label>PASSWORD</label>
                <input type="password" id="loginPassword">
                <small class="error" id="loginPasswordError"></small>

                <button type="submit" class="Format-btn">LOGIN</button>

                <div class="bottom-links">
                    <span onclick="showPage('recoverPage')">Forgot Password?</span>
                    <span onclick="showPage('registerPage')" class="create">Create Account</span>
                </div>

            </form>
        </div>
    </div>


    <!-- ================= RECOVER PAGE ================= -->
    <div class="page" id="recoverPage">
        <div class="simple-box">

            <h2>Recover Your Password</h2>

            <form id="recoverForm">

                <label>Username:</label>
                <input type="text" id="recoverUsername">
                <small class="error" id="recoverUsernameError"></small>

                <label>Email:</label>
                <input type="email" id="recoverEmail">
                <small class="error" id="recoverEmailError"></small>

                <button type="submit" class="Format-btn">Recover Password</button>

                <p onclick="showPage('loginPage')" class="back-link">
                    Back to Login
                </p>

            </form>
        </div>
    </div>


    <!-- ================= REGISTER PAGE ================= -->
    <div class="page" id="registerPage">
        <div class="simple-box">

            <h2>Create New Account</h2>

            <form id="registerForm">

                <label>Username:</label>
                <input type="text" id="registerUsername">
                <small class="error" id="registerUsernameError"></small>

                <label>Password:</label>
                <input type="password" id="registerPassword">
                <small class="error" id="registerPasswordError"></small>

                <label>Email:</label>
                <input type="email" id="registerEmail">
                <small class="error" id="registerEmailError"></small>

                <label>Account Type:</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="role" value="user"> User
                    </label>
                    <label>
                        <input type="radio" name="role" value="admin"> Admin
                    </label>
                </div>
                <small class="error" id="registerRoleError"></small>

                <button type="submit" class="Format-btn">
                    Create Account
                </button>

                <p onclick="showPage('loginPage')" class="back-link">
                    Back to Login
                </p>

            </form>
        </div>
    </div>

</div>

<script src="landing-page.js"></script>
<!-- Bootstrap JS (for future use in admin/user pages) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
